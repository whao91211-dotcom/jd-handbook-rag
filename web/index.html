<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>员工手册问答 · 本地演示</title><link rel="icon" href="/assets/jd-logo.png"><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/app.js"></script></head>
<body>
<header><div class="brand"><img src="/assets/jd-logo.png" alt="京东" width="48" height="48"><h1>员工手册问答</h1><span class="local">本地演示</span></div><span id="health" class="health">正在连接服务</span></header>
<div class="workspace">
<aside class="sidebar"><button id="new-chat" class="new">＋ 新建问答</button><section><h2>试试这样问</h2><div id="examples"></div></section><section class="history-section"><div class="section-heading"><h2>最近提问</h2><button id="clear-history" class="text-button">清除</button></div><div id="history"></div></section><p class="sidebar-note">个人学习项目<br>非京东官方服务</p></aside>
<main><div id="conversation" aria-live="polite"><div class="welcome"><span class="book-icon" aria-hidden="true">§</span><h2>有问题，先查手册。</h2><p>提问后查看回答和引用条款。缺少个人条件时，系统会提示需要确认的信息。</p><div class="welcome-example">例如：请了一天事假，那天15块钱餐补还发吗？</div><p class="cold-note">首次检索需要加载本地模型，可能较慢。</p></div></div>
<div class="composer"><div id="notice" class="notice" role="status" hidden></div><div id="metrics" class="metrics" hidden></div><form id="ask-form"><label class="sr-only" for="question">你的问题</label><div class="input-wrap"><textarea id="question" maxlength="500" rows="3" placeholder="输入你的问题，例如：请一天假会扣工资吗？" required></textarea><span id="counter">0/500</span></div><div class="composer-controls"><label class="sr-only" for="profile">问答方案</label><select id="profile"><option value="quality">优化方案 · 低推理</option><option value="fast">快速方案 · 关闭推理</option><option value="baseline">原方案</option></select><div class="actions"><button type="button" id="retrieve-button" class="secondary">仅查看证据</button><button type="submit" id="send" class="primary">发送问题</button></div></div><p class="input-hint">Enter发送，Shift＋Enter换行。记录仅保存在此浏览器。</p></form></div></main>
<aside class="evidence"><div class="evidence-heading"><h2>引用依据</h2><p id="evidence-hint">点击回答中的引用，核对原文。</p></div><div id="sources"><div class="evidence-empty"><span aria-hidden="true">❝</span><p>条款原文会显示在这里。</p><small>包含来源、页码与章节。</small></div></div><p class="version-note">依据2018版手册，现行政策请向负责部门核实。</p></aside></div>
</body></html>
